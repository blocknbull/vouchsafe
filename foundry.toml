[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
offline = true
no_match_path = "test/fork/*"      # plain `forge test` stays offline

# FOUNDRY_PROFILE=fork forge test   -> runs test/fork/* against BNB Chain mainnet state
[profile.fork]
offline = false
match_path = "test/fork/*"
no_match_path = "test/__none__/*"

[rpc_endpoints]
bsc = "https://bsc-rpc.publicnode.com"
